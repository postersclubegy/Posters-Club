<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posters Club - Order Admin Dashboard</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2859 0%, #0f1e3e 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #1a2859;
            color: white;
            padding: 2rem;
            border-bottom: 4px solid #d4af37;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .content {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a2859;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-send {
            background: #d4af37;
            color: #1a2859;
        }

        .btn-send:hover {
            background: #c5941f;
            transform: translateY(-2px);
        }

        .btn-clear {
            background: #ddd;
            color: #333;
        }

        .btn-clear:hover {
            background: #ccc;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-box {
            background: #f0f4f8;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid #d4af37;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .info-box strong {
            color: #1a2859;
        }

        .footer {
            background: #f9f7f4;
            padding: 1rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🅿️ Order Admin Dashboard</h1>
            <p>Send order confirmations to customers via email</p>
        </div>

        <div class="content">
            <div class="alert" id="alert"></div>

            <div class="info-box">
                <strong>📧 How it works:</strong><br>
                1. After confirming with customer on WhatsApp<br>
                2. Fill in their details below<br>
                3. Click "Send Confirmation Email"<br>
                4. They receive confirmation email
            </div>

            <form id="adminForm" onsubmit="sendConfirmation(event)">
                <div class="form-group">
                    <label for="customerName">Customer Name *</label>
                    <input type="text" id="customerName" required placeholder="e.g., Ahmed Hassan">
                </div>

                <div class="form-group">
                    <label for="customerEmail">Customer Email *</label>
                    <input type="email" id="customerEmail" required placeholder="customer@email.com">
                </div>

                <div class="form-group">
                    <label for="orderID">Order ID *</label>
                    <input type="text" id="orderID" required placeholder="e.g., PC-1692345678">
                </div>

                <div class="form-group">
                    <label for="customMessage">Custom Message (Optional)</label>
                    <textarea id="customMessage" placeholder="Add a personal message to the customer..."></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-send">📧 Send Confirmation Email</button>
                    <button type="reset" class="btn btn-clear">Clear Form</button>
                </div>
            </form>
        </div>

        <div class="footer">
            <p>Posters Club Admin Dashboard • Powered by EmailJS</p>
        </div>
    </div>

    <script type="text/javascript">
        // Initialize EmailJS - REPLACE WITH YOUR CREDENTIALS
        emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); // Replace with your public key

        const OWNER_EMAIL = "your-email@gmail.com"; // Replace with your email
        const OWNER_NAME = "Posters Club";

        // Send Confirmation Email
        function sendConfirmation(event) {
            event.preventDefault();

            const customerName = document.getElementById('customerName').value;
            const customerEmail = document.getElementById('customerEmail').value;
            const orderID = document.getElementById('orderID').value;
            const customMessage = document.getElementById('customMessage').value;

            const alertBox = document.getElementById('alert');

            // Show loading
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Sending...';
            btn.disabled = true;

            const templateParams = {
                to_email: customerEmail,
                customer_name: customerName,
                order_id: orderID,
                custom_message: customMessage || 'Thank you for your order!',
                owner_name: OWNER_NAME
            };

            emailjs.send("service_posters_club", "template_order_confirmation", templateParams)
                .then(response => {
                    // Success
                    alertBox.className = 'alert success';
                    alertBox.textContent = `✅ Confirmation email sent to ${customerEmail}!`;
                    
                    // Reset form
                    document.getElementById('adminForm').reset();
                    
                    // Restore button
                    btn.textContent = originalText;
                    btn.disabled = false;

                    // Hide alert after 5 seconds
                    setTimeout(() => {
                        alertBox.style.display = 'none';
                    }, 5000);
                })
                .catch(error => {
                    // Error
                    alertBox.className = 'alert error';
                    alertBox.textContent = `❌ Failed to send email. Error: ${error.text || error.message}`;
                    
                    btn.textContent = originalText;
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
